<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#04101c"><title>معرضي | MA3RADI</title><style>body{margin:0;background:#02070d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.l{text-align:center}.r{width:46px;height:46px;border:3px solid #203a54;border-top-color:#ef334d;border-radius:50%;animation:s .8s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}small{color:#ff8a00;letter-spacing:4px}</style></head><body><div class="l"><div class="r"></div><h2>معرضي</h2><small>MA3RADI</small></div><script>(async()=>{try{const fs=['p01.txt','p02.txt','p03.txt','p04.txt','p05.txt','p06.txt','p07.txt','p08.txt'];const ps=await Promise.all(fs.map(f=>fetch(f+'?v=9').then(r=>{if(!r.ok)throw Error(f);return r.text()})));const bin=Uint8Array.from(atob(ps.join('')),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="padding:30px;text-align:center">تعذر تحميل معرضي. حدّث الصفحة.</div>';console.error(e)}})();</script></body></html>
