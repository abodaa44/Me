<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#04101c"><title>معرضي | MA3RADI</title><style>body{margin:0;background:#02070d;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.l{text-align:center}.r{width:46px;height:46px;border:3px solid #203a54;border-top-color:#ef334d;border-radius:50%;animation:s .8s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}small{color:#ff8a00;letter-spacing:4px}</style></head><body><div class="l"><div class="r"></div><h2>معرضي</h2><small>MA3RADI</small></div><script>(async()=>{try{const B='https://raw.githubusercontent.com/abodaa44/Me/main/';const fs=['p01.txt','p02.txt','p03.txt','p04.txt','p05.txt','p06.txt','p07.txt','p08.txt'];const ps=await Promise.all(fs.map(f=>fetch(B+f+'?v=13',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(f);return r.text()})));const bin=Uint8Array.from(atob(ps.join('')),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();const patch=`<script>(async()=>{try{const style=document.createElement('style');style.textContent='.stage{bottom:78px!important;height:235px!important;width:min(660px,94%)!important;z-index:2!important;pointer-events:none}.stage video{width:100%;height:100%;object-fit:contain;mix-blend-mode:screen;filter:contrast(1.08) saturate(1.08) drop-shadow(0 25px 22px rgba(0,0,0,.72));transform:translateY(8px) scale(1.06)}@media(max-width:850px){.stage{bottom:74px!important;height:215px!important;width:96%!important}}';document.head.appendChild(style);const hero=document.querySelector('#home .hero');if(hero){const h1=hero.querySelector('.heroCopy h1');const p=hero.querySelector('.heroCopy p');if(h1)h1.textContent='أكثر من مجرد سيارة... إنها تجربة';if(p)p.textContent='اكتشف السيارات كما لو كنت داخل المعرض.';}const ph=document.querySelector('#home .stage .placeholder');if(ph){const b64=(await (await fetch(B+'assets/jeep360.b64?v=13',{cache:'no-store'})).text()).trim();const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const u=URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}));const v=document.createElement('video');v.src=u;v.autoplay=true;v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';v.setAttribute('aria-label','Jeep Gladiator Rubicon 360');ph.replaceWith(v);v.play().catch(()=>{});}if(typeof dealers!=='undefined'&&!dealers.some(d=>d.id==='scorpion'))dealers.unshift({id:'scorpion',name:'معرض العقرب',city:'الرياض',count:22,rating:4.9,img:'https://images.unsplash.com/photo-1493238792000-8113da705763?auto=format&fit=crop&w=900&q=80'});if(typeof cars!=='undefined'&&!cars.some(c=>c.id==='jeep'))cars.unshift({id:'jeep',name:'Jeep Gladiator Rubicon',dealer:'scorpion',price:'498,000',mileage:'12,000 كم',year:'2024',img:'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=1000&q=80'});const info=document.querySelector('#home .heroInfo');if(info)info.innerHTML='<div><b>Jeep Gladiator Rubicon</b><div class="muted small">معرض العقرب • سيارة مختارة من معرضي</div></div><div class="price">498,000 ر.س</div><button class="btn red" onclick="openCar(\'jeep\')">شاهد السيارة</button>';const s=document.querySelector('#home .stats .stat span');if(s)s.textContent='سيارة حقيقية تدور داخل الشو روم';}catch(e){console.error('MA3RADI showroom patch',e)}})();<\/script>`;html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="padding:30px;text-align:center"><h2>معرضي</h2><div>تعذر تحميل النسخة. حدّث الصفحة.</div></div>';console.error(e)}})();</script></body></html>
